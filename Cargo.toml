[package]
name = "ncview-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Terminal-native NetCDF scientific data viewer"

[patch.crates-io]
# Fixes HDF5 v2 continuation headers that carry creation-order fields. The
# upstream parser otherwise shifts datatype bodies by two bytes in common
# libnetcdf-generated COARDS files.
oxih5-format = { path = "vendor/oxih5-format" }
# Local forks are kept at the reader boundary while the source-backed HDF5
# API is developed. They currently preserve the upstream behavior; remote
# NetCDF-4 must not be enabled until these forks consume ByteSource ranges.
oxih5 = { path = "vendor/oxih5" }
oxinetcdf = { path = "vendor/oxinetcdf" }

[[bin]]
name = "ncv"
path = "src/main.rs"

[dependencies]
base64-simd = "0.8"
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
colorous = "1.0.16"
human-panic = "2.0"
crossterm = "0.29"
grib = { version = "0.18.4", default-features = false, features = ["jpeg2000-unpack-with-hayro", "png-unpack-with-png-crate", "ccsds-unpack-with-rust-aec", "gridpoints-proj", "time-calculation"] }
image = { version = "0.25.10", default-features = false }
kiddo = { version = "6.3", default-features = false }
ndarray = "0.17.2"
netcdf-reader = { version = "0.9.1", default-features = false }
object_store = { version = "=0.14.1", default-features = false, features = ["aws-base", "azure-base", "gcp-base", "reqwest", "ring"] }
oxih5 = "0.1"
oxinetcdf = "0.1"
ab_glyph = "0.2"
bytes = "=1.12.1"
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend", "line_series", "point_series"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rayon = "1.12"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1"
tempfile = "3"

[build-dependencies]
serde_json = "1"

# A musl build cannot use a host libproj or SQLite built for glibc.  Enable
# both bundled builds only for the static Linux release target; native builds
# retain the normal system-PROJ discovery behavior.
[target.'cfg(target_env = "musl")'.dependencies]
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
proj = { version = "0.31", default-features = false, features = ["bundled_proj"] }

[[bench]]
name = "interactive_paths"
harness = false

[[bench]]
name = "remote_streaming"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
